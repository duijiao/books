<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>巴西华人基督教会记账</title>
<style>
:root{
  --y:#ffc53d; --y-deep:#f2b400;
  --ink:#1c2230; --muted:#8a8f9c; --line:#eef0f3; --bg:#f5f6f8;
  --green:#12a671; --green-bg:#e7f7f1;
  --red:#e8515a; --red-bg:#fdebec;
  --blue:#3b82c4;
  --shadow:0 8px 24px rgba(20,22,30,.07);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;padding-bottom:calc(78px + var(--safe-b));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input,select{-webkit-appearance:none;appearance:none}
.app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
.page{display:none}.page.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
b{font-weight:700}

/* ---------- 顶部黄色区块 ---------- */
.yellow{background:linear-gradient(180deg,var(--y) 0%,var(--y-deep) 100%);padding:calc(22px + var(--safe-t)) 16px 18px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:18px;font-weight:800;letter-spacing:.2px}
.sync{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.55);white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#999;flex:none}
.sync.on .dot{background:var(--green)}
.sync.off .dot{background:var(--red)}
.sync.mid .dot{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.period{display:flex;gap:16px;align-items:end;margin-top:16px}
.period-left{min-width:112px;border-right:1px solid rgba(0,0,0,.15);padding-right:14px}
.year{font-size:14px;color:rgba(0,0,0,.55)}
.month{font-size:32px;line-height:1.1;font-weight:800}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats span{font-size:12px;color:rgba(0,0,0,.55)}
.stats b{display:block;font-size:17px;margin-top:6px;font-variant-numeric:tabular-nums}
.green{color:var(--green)}.red{color:var(--red)}

/* ---------- 明细列表 ---------- */
.content{padding:10px 14px 18px}
.day-title{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;padding:14px 6px 8px;position:relative}
.day-title::before{content:"";position:absolute;left:0;right:0;top:2px;border-top:1px dashed var(--line)}
.day-title span:first-child{background:var(--bg);padding-right:8px;position:relative}
.day-title span:last-child{background:var(--bg);padding-left:8px;position:relative}
.bill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 10px;background:#fff;border-radius:var(--r-md);margin-bottom:8px;box-shadow:var(--shadow);transition:transform .1s}
.bill:active{transform:scale(.98)}
.bill-left{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:40px;height:40px;flex:none;background:#f4f4f4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px}
.bill-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-size:16.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- 底部导航 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:var(--safe-b)}
.nav-inner{max-width:560px;margin:0 auto;height:66px;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;color:#9a9fa8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10.5px;min-height:44px}
.nav button.active{color:var(--ink)}
.nicon{font-size:20px}
.plus{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,var(--y),var(--y-deep));display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-22px;box-shadow:0 6px 14px rgba(242,180,0,.45);border:5px solid #fff;color:#20242a;font-weight:300}

/* ---------- 底部弹出面板（记账/编辑） ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:28;display:none}
.backdrop.show{display:block}
.panel{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.1);padding:16px 16px calc(16px + var(--safe-b));z-index:29;display:none;border-radius:20px 20px 0 0;transform:translateY(12px);transition:transform .18s ease,bottom .15s ease;max-height:86vh;overflow-y:auto}
.panel.show{display:block;transform:translateY(0)}
.panel-title{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.panel-title .x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:4px}
.money-line{display:flex;align-items:center;border-bottom:2px solid var(--line);margin-bottom:12px;padding-bottom:6px}
.money-line span{font-size:26px;font-weight:700;margin-right:6px;color:var(--muted)}
.money-line input{border:0;outline:0;font-size:30px;font-weight:700;width:100%;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;width:100%;background:#fbfbfc;min-height:44px;font-size:15px}
.field:focus{outline:2px solid var(--y);background:#fff}
.save{width:100%;border:0;background:linear-gradient(180deg,var(--y),var(--y-deep));border-radius:var(--r-sm);padding:14px;font-size:16px;font-weight:800;min-height:48px}
.save:active{transform:scale(.99)}
.danger-btn{width:100%;border:0;background:var(--red-bg);color:var(--red);border-radius:var(--r-sm);padding:12px;font-size:15px;font-weight:700;margin-top:8px;min-height:44px;display:none}
.danger-btn.show{display:block}

/* ---------- 记账页 / 图表页 顶部 ---------- */
.book-head,.chart-head,.me-head,.export-head{background:linear-gradient(180deg,var(--y),var(--y-deep));padding:calc(20px + var(--safe-t)) 14px 0}
.book-tabs,.chart-type{display:flex;justify-content:center;gap:32px;align-items:center;font-size:20px;font-weight:700;position:relative}
.book-tabs button,.chart-type button{border:0;background:transparent;font-size:19px;padding:10px 4px;color:rgba(0,0,0,.45);min-height:44px}
.book-tabs button.active,.chart-type button.active{border-bottom:3px solid #222;color:#20242a}
.cancel{position:absolute;right:0;font-size:15px!important;border:0!important;color:rgba(0,0,0,.5)!important}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;padding:24px 16px 18px;background:var(--bg)}
.cat-btn{border:0;background:transparent;color:#5b5f68;font-size:13px;min-height:44px}
.cat-circle{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:var(--shadow);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:25px;transition:transform .1s}
.cat-btn:active .cat-circle{transform:scale(.94)}
.cat-btn.selected .cat-circle{background:#fff3d0;box-shadow:0 0 0 2px var(--y-deep) inset}

/* ---------- 弹出对话框 ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:80;align-items:flex-end}
.modal.active{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:86vh;overflow:auto}
.sheet-title{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.close{border:0;background:transparent;font-size:24px;color:var(--muted);min-height:44px;min-width:44px}
.manage-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.manage-row input{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;min-width:0;background:#fbfbfc;min-height:44px}
.manage-row button{border:0;border-radius:var(--r-sm);background:var(--red-bg);color:var(--red);padding:0 12px;font-weight:700;min-height:44px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:2px 0 12px}
.hint a{color:var(--blue)}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);background:#20242a;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:100;font-size:14px;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}

/* ---------- 图表页 ---------- */
.segment{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #222;border-radius:10px;overflow:hidden;margin:16px 0 14px}
.segment button{border:0;border-right:1px solid #222;background:transparent;padding:10px;font-weight:700;min-height:44px}
.segment button:last-child{border-right:0}
.segment button.active{background:#20242a;color:#fff}
.chart-box{padding:0 14px 6px}
.meta{color:var(--muted);line-height:1.8;font-size:13.5px}
.meta b{color:var(--ink)}
.line{width:100%;height:170px;margin-top:6px}
.rank{padding:16px 14px 4px}
.rank-title{font-size:17px;font-weight:800;margin-bottom:14px}
.rank-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rank-info{flex:1}
.rank-name{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--y-deep));border-radius:99px}

/* ---------- 我的 / 设置页 ---------- */
.me-head{padding-bottom:22px}
.me-name{text-align:center;font-size:18px;font-weight:800;margin-bottom:18px}
.me-stats{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.me-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.me-stats span{color:rgba(0,0,0,.55);font-size:12.5px}
.card{margin:14px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card-label{font-size:12px;color:var(--muted);padding:14px 18px 0;font-weight:700;letter-spacing:.3px}
.me-item{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #f2f2f4;font-size:15.5px;cursor:pointer;min-height:44px}
.me-item:last-child{border-bottom:0}
.me-item:active{background:#fafafa}
.me-left{display:flex;align-items:center;gap:10px}
.me-item span:last-child{color:#c8ccd2}
.me-item .chip{font-size:12px;color:var(--muted);font-weight:400}
.empty{text-align:center;color:#b4b8c0;padding:40px 20px;font-size:14px}
.empty .em-ico{font-size:30px;display:block;margin-bottom:8px;opacity:.6}

/* ---------- 云端连接卡片/弹窗 ---------- */
.cloud-status-row{display:flex;align-items:center;gap:8px;padding:14px 18px}
.cloud-status-row .dot{width:9px;height:9px;border-radius:50%;background:#ccc}
.cloud-status-row.on .dot{background:var(--green)}
.cloud-status-row.off .dot{background:var(--red)}
.cloud-status-row .txt{flex:1;font-size:14px;color:var(--muted)}

/* ---------- 加载遮罩 ---------- */
.loading-overlay{position:fixed;inset:0;background:rgba(245,246,248,.9);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.loading-overlay.show{display:flex}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--y-deep);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay .msg{font-size:13.5px;color:var(--muted)}

@media(min-width:768px){.app,.nav-inner,.sheet{max-width:760px}.cat-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1024px){body{background:#e9e9ea}.app,.nav-inner,.sheet{max-width:980px}.modal{align-items:center}.sheet{border-radius:20px}.panel{left:50%;right:auto;transform:translate(-50%,12px);max-width:520px;width:92%;border-radius:20px;bottom:24px}.panel.show{transform:translate(-50%,0)}.backdrop{}}
</style>
</head>
<body>
<main class="app">
  <section id="home" class="page active"></section>
  <section id="chart" class="page"></section>
  <section id="book" class="page"></section>
  <section id="exportPage" class="page"></section>
  <section id="me" class="page"></section>
</main>

<nav class="nav"><div class="nav-inner">
  <button data-nav="home" class="active" onclick="go('home')"><span class="nicon">▤</span><span>明细</span></button>
  <button data-nav="chart" onclick="go('chart')"><span class="nicon">📈</span><span>图表</span></button>
  <button onclick="go('book')"><span class="plus">＋</span><span>记账</span></button>
  <button data-nav="exportPage" onclick="go('exportPage')"><span class="nicon">⬇️</span><span>导出/备份</span></button>
  <button data-nav="me" onclick="go('me')"><span class="nicon">⚙️</span><span>设置</span></button>
</div></nav>

<div class="backdrop" id="backdrop" onclick="hidePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-title"><span id="panelTitle">记一笔</span><button class="x" onclick="hidePanel()">×</button></div>
  <div class="money-line"><span>R$</span><input id="amountInput" inputmode="decimal" placeholder="0,00"></div>
  <div class="row"><input id="dateInput" type="date" class="field"><select id="accountInput" class="field"></select></div>
  <div class="row"><input id="handlerInput" class="field" placeholder="经手人（选填）"><input id="noteInput" class="field" placeholder="备注（选填）"></div>
  <button class="save" onclick="saveTx()">完成</button>
  <button class="danger-btn" id="deleteTxBtn" onclick="deleteTx()">删除这条记录</button>
</div>

<div class="modal" id="catModal"><div class="sheet"><div class="sheet-title"><span id="catTitle">类别设置</span><button class="close" onclick="closeModal('catModal')">×</button></div><div id="catManage"></div><div class="manage-row"><input id="newCatName" placeholder="中文类别"><input id="newCatPt" placeholder="葡文类别"><button style="background:#fff3d0;color:#7a5b00" onclick="addCat()">添加</button></div></div></div>
<div class="modal" id="periodModal"><div class="sheet"><div class="sheet-title"><span>选择年月</span><button class="close" onclick="closeModal('periodModal')">×</button></div><div class="row"><select id="yearSelect" class="field"></select><select id="monthSelect" class="field"></select></div><button class="save" onclick="applyPeriod()">确定</button></div></div>
<div class="modal" id="exportModal"><div class="sheet"><div class="sheet-title"><span>导出设置</span><button class="close" onclick="closeModal('exportModal')">×</button></div><div class="row"><select id="exportScope" class="field"><option value="week">按本周导出</option><option value="month" selected>按当前月份导出</option><option value="year">按当前年份导出</option><option value="all">导出全部</option></select><select id="exportLang" class="field"><option value="zh">中文显示</option><option value="pt">Português</option></select></div><button class="save" onclick="exportCSV()">导出 CSV</button></div></div>
<div class="modal" id="accountModal"><div class="sheet"><div class="sheet-title"><span>账户管理</span><button class="close" onclick="closeModal('accountModal')">×</button></div><div id="accountManage"></div><div class="manage-row" style="grid-template-columns:1fr auto"><input id="newAccountName" placeholder="新增账户名称"><button style="background:#fff3d0;color:#7a5b00" onclick="addAccount()">添加</button></div></div></div>

<div class="modal" id="cloudModal"><div class="sheet">
  <div class="sheet-title"><span>连接云端数据库</span><button class="close" onclick="closeModal('cloudModal')">×</button></div>
  <div class="hint">
    1. 打开 supabase.com 注册并新建一个项目<br>
    2. 在项目的 SQL Editor 中运行随本应用附带的 <b>supabase_schema.sql</b> 脚本，建好数据表<br>
    3. 打开项目 Settings → API，复制 <b>Project URL</b> 和 <b>anon public key</b>，粘贴到下面
  </div>
  <div class="row" style="grid-template-columns:1fr">
    <input id="cloudUrlInput" class="field" placeholder="Project URL，例如 https://xxxx.supabase.co">
  </div>
  <div class="row" style="grid-template-columns:1fr;margin-top:0">
    <input id="cloudKeyInput" class="field" placeholder="anon public key">
  </div>
  <button class="save" onclick="submitCloudConfig()">连接</button>
  <div class="hint" id="cloudModalMsg" style="text-align:center"></div>
</div></div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="msg" id="loadingMsg">正在连接云端数据库…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   基础工具函数
   ============================================================ */
const CFG_KEY='bccb-cloud-config-v1';
const icons=['🍽','🛍','🧻','🚌','🥕','🍎','🍪','🚲','🎤','📞','👕','✂️','🏠','🛋','👶','👴','💬','✈️','💻','🚗','⚕️','📚','🎓','💵','🎁','💼','🔧','❤️','⛪','⚙️'];

let sb=null, connected=false, loading=true, realtimeChannel=null;
let cloudCfg=null;
try{cloudCfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch{cloudCfg=null}

let type='EXPENSE', selectedCat='', editingId=null;
let viewYear, viewMonth, chartType='EXPENSE', chartRange='month', selectedChartKey='';
{const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth()+1;}

let db={cats:{INCOME:[],EXPENSE:[]}, catPt:{}, catRow:{INCOME:{},EXPENSE:{}}, accounts:[], accountRow:{}, tx:[]};

function seedDefaults(){
  return {
    cats:{INCOME:['主日奉献','十一奉献','银行奉献','特别奉献','宣教奉献','其他收入'],EXPENSE:['周日饮食','周间饮食','安保费用','卫生清洁','水费','电费','网络','会计服务','教师传道补助','教会关怀','青少年团契','妇女事工','采购','其他支出']},
    catPt:{'主日奉献':'Oferta Dominical','十一奉献':'Dízimo','银行奉献':'Oferta Bancária','特别奉献':'Oferta Especial','宣教奉献':'Oferta Missionária','其他收入':'Outras Receitas','周日饮食':'Alimentação Dominical','周间饮食':'Alimentação Semanal','安保费用':'Segurança','卫生清洁':'Limpeza','水费':'Água','电费':'Energia','网络':'Internet','会计服务':'Contabilidade','教师传道补助':'Ajuda de Custo Pastoral','教会关怀':'Cuidado Pastoral','青少年团契':'Ministério de Jovens','妇女事工':'Ministério de Mulheres','采购':'Compras','其他支出':'Outras Despesas'},
    accounts:['现金箱','银行账户','PIX账户']
  };
}

function today(){return new Date().toISOString().slice(0,10)}
function cents(v){return Math.round((Number(String(v||'').replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0)*100)}
function brl(c){return 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format((Number(c)||0)/100)}
function fmtInput(c){return (Number(c)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.remove('show'),1600)}
function openModal(id){document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}
function showPanel(){document.getElementById('panel').classList.add('show');document.getElementById('backdrop').classList.add('show');adjustPanelForKeyboard()}
function hidePanel(){document.getElementById('panel').classList.remove('show');document.getElementById('backdrop').classList.remove('show');editingId=null;document.getElementById('panel').style.bottom='';}
function adjustPanelForKeyboard(){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  const inset=Math.max(window.innerHeight-(vv.height+vv.offsetTop),0);
  const panel=document.getElementById('panel');
  panel.style.bottom=inset+'px';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{if(document.getElementById('panel').classList.contains('show'))adjustPanelForKeyboard()});
  window.visualViewport.addEventListener('scroll',()=>{if(document.getElementById('panel').classList.contains('show'))adjustPanelForKeyboard()});
}
function setLoading(on,msg){loading=on;document.getElementById('loadingOverlay').classList.toggle('show',on);if(msg)document.getElementById('loadingMsg').textContent=msg}

function activeTx(){return db.tx.filter(t=>t.status!=='VOID')}
function ym(){return viewYear+'-'+String(viewMonth).padStart(2,'0')}
function monthTx(){return activeTx().filter(t=>t.date.startsWith(ym()))}
function sum(arr,t){return arr.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0)}
function catIcon(c){let i=db.cats.INCOME.concat(db.cats.EXPENSE).indexOf(c);return icons[(i<0?0:i)%icons.length]}
function dateTitle(d){const x=new Date(d+'T00:00:00');return `${String(x.getMonth()+1).padStart(2,'0')}月${String(x.getDate()).padStart(2,'0')}日 ${['周日','周一','周二','周三','周四','周五','周六'][x.getDay()]}`}

function syncBadge(){const cls=loading?'mid':(connected?'on':'off');const txt=loading?'同步中…':(connected?'已连接云端':'未连接云端');return `<div class="sync ${cls}" onclick="openModal('cloudModal')"><span class="dot"></span>${txt}</div>`}

function renderHome(){
  const arr=monthTx(),inc=sum(arr,'INCOME'),exp=sum(arr,'EXPENSE'),bal=inc-exp,groups={};
  arr.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  const body=!connected?`<div class="empty"><span class="em-ico">☁️</span>还没有连接云端数据库<br><span style="text-decoration:underline" onclick="openModal('cloudModal')">点此设置</span></div>`
    :(Object.keys(groups).length?Object.entries(groups).map(([d,list])=>`<div><div class="day-title"><span>${dateTitle(d)}</span><span>收入 ${brl(sum(list,'INCOME'))} · 支出 ${brl(sum(list,'EXPENSE'))}</span></div>${list.map(billRow).join('')}</div>`).join(''):'<div class="empty"><span class="em-ico">🧾</span>本月暂无收支</div>');
  document.getElementById('home').innerHTML=`<div class="yellow"><div class="top-row"><div class="title">巴西华人基督教会记账</div>${syncBadge()}</div><div class="period"><div class="period-left" onclick="openPeriod()">
    <div class="year">${viewYear}年</div><div class="month">${String(viewMonth).padStart(2,'0')}月▼</div></div><div class="stats"><div><span>收入</span><b class="green">${brl(inc)}</b></div><div><span>支出</span><b>${brl(exp)}</b></div><div><span>余额</span><b class="${bal<0?'red':'green'}">${brl(bal)}</b></div></div></div></div><div class="content">${body}</div>`;
}
function billRow(t){return `<div class="bill" onclick="openEditTx('${t.id}')"><div class="bill-left"><div class="ico">${catIcon(t.cat)}</div><div style="min-width:0"><div class="bill-name">${t.cat}</div><div class="bill-sub">${t.account||''}${t.handler?' · 经手人：'+t.handler:''}${t.note?' · '+t.note:''}</div></div></div><div class="amount ${t.type==='INCOME'?'green':''}">${t.type==='INCOME'?'+':'-'}${brl(t.amount)}</div></div>`}
function openPeriod(){const ys=document.getElementById('yearSelect'),ms=document.getElementById('monthSelect');ys.innerHTML='';for(let y=2020;y<=2035;y++)ys.innerHTML+=`<option value="${y}" ${y===viewYear?'selected':''}>${y}年</option>`;ms.innerHTML='';for(let m=1;m<=12;m++)ms.innerHTML+=`<option value="${m}" ${m===viewMonth?'selected':''}>${String(m).padStart(2,'0')}月</option>`;openModal('periodModal')}
function applyPeriod(){viewYear=+document.getElementById('yearSelect').value;viewMonth=+document.getElementById('monthSelect').value;closeModal('periodModal');render();go('home')}

function renderBook(){
  document.getElementById('book').innerHTML=`<div class="book-head"><div class="book-tabs"><button class="${type==='EXPENSE'?'active':''}" onclick="setType('EXPENSE')">支出</button><button class="${type==='INCOME'?'active':''}" onclick="setType('INCOME')">收入</button><button class="cancel" onclick="go('home')">取消</button></div></div><div class="cat-grid">${db.cats[type].map(c=>`<button class="cat-btn ${selectedCat===c?'selected':''}" onclick="selectCat('${esc(c)}')"><div class="cat-circle">${catIcon(c)}</div>${c}</button>`).join('')}<button class="cat-btn" onclick="openCatManage()"><div class="cat-circle">⚙️</div>设置</button></div>`;
}
function setType(t){type=t;selectedCat='';hidePanel();renderBook()}
function selectCat(c){
  if(!connected) return toast('请先连接云端数据库');
  selectedCat=c;editingId=null;
  document.getElementById('panelTitle').textContent='记一笔';
  document.getElementById('deleteTxBtn').classList.remove('show');
  document.getElementById('dateInput').value=today();
  document.getElementById('amountInput').value='';
  document.getElementById('handlerInput').value='';
  document.getElementById('noteInput').value='';
  document.getElementById('accountInput').innerHTML=db.accounts.map(a=>`<option>${a}</option>`).join('');
  renderBook();showPanel();setTimeout(()=>document.getElementById('amountInput').focus(),80);
}
function openEditTx(id){
  const t=db.tx.find(x=>x.id===id); if(!t) return;
  editingId=id; type=t.type; selectedCat=t.cat;
  document.getElementById('panelTitle').textContent='编辑'+(t.type==='INCOME'?'收入':'支出');
  document.getElementById('deleteTxBtn').classList.add('show');
  document.getElementById('accountInput').innerHTML=db.accounts.map(a=>`<option ${a===t.account?'selected':''}>${a}</option>`).join('');
  document.getElementById('amountInput').value=fmtInput(t.amount);
  document.getElementById('dateInput').value=t.date;
  document.getElementById('handlerInput').value=t.handler||'';
  document.getElementById('noteInput').value=t.note||'';
  showPanel();
}
async function saveTx(){
  if(!connected) return toast('请先连接云端数据库');
  const amount=cents(document.getElementById('amountInput').value);
  if(!selectedCat) return toast('请选择类别');
  if(amount<=0) return toast('请输入金额');
  const date=document.getElementById('dateInput').value||today();
  const row={type,category:selectedCat,category_pt:db.catPt[selectedCat]||selectedCat,amount_cents:amount,tx_date:date,account:document.getElementById('accountInput').value||null,handler:document.getElementById('handlerInput').value.trim()||null,note:document.getElementById('noteInput').value.trim()||null,status:'ACTIVE'};
  try{
    if(editingId){
      const {data,error}=await sb.from('transactions').update(row).eq('id',editingId).select().single();
      if(error) throw error;
      const idx=db.tx.findIndex(x=>x.id===editingId); if(idx>-1) db.tx[idx]=rowToTx(data);
    }else{
      const {data,error}=await sb.from('transactions').insert(row).select().single();
      if(error) throw error;
      db.tx.unshift(rowToTx(data));
    }
    editingId=null;selectedCat='';hidePanel();
    const d=new Date(date+'T00:00:00');viewYear=d.getFullYear();viewMonth=d.getMonth()+1;
    go('home');toast('已保存');
  }catch(err){console.error(err);toast('保存失败：'+(err.message||'网络错误'))}
}
async function deleteTx(){
  if(!editingId) return;
  if(!confirm('确定删除这条记录？')) return;
  try{
    const {error}=await sb.from('transactions').delete().eq('id',editingId);
    if(error) throw error;
    db.tx=db.tx.filter(x=>x.id!==editingId);
    hidePanel();render();toast('已删除');
  }catch(err){console.error(err);toast('删除失败：'+(err.message||''))}
}

   类别管理
   ============================================================ */
function openCatManage(){
  document.getElementById('catTitle').textContent=(type==='INCOME'?'收入':'支出')+'类别设置';
  document.getElementById('catManage').innerHTML=db.cats[type].map((c,i)=>`<div class="manage-row"><input value="${esc(c)}" onchange="renameCat(${i},this.value,'cn')"><input value="${esc(db.catPt[c]||c)}" onchange="renameCat(${i},this.value,'pt')"><button onclick="delCat(${i})">删除</button></div>`).join('');
  document.getElementById('newCatName').value='';document.getElementById('newCatPt').value='';
  openModal('catModal');
}
async function renameCat(i,v,mode){
  v=v.trim(); if(!v) return openCatManage();
  const old=db.cats[type][i], meta=db.catRow[type][old]; if(!meta) return;
  try{
    if(mode==='cn'){
      if(v!==old && db.cats[type].includes(v)){toast('类别已存在');return openCatManage()}
      const {error}=await sb.from('categories').update({name:v}).eq('id',meta.id); if(error) throw error;
      if(old!==v){await sb.from('transactions').update({category:v}).eq('category',old);db.tx.forEach(t=>{if(t.cat===old)t.cat=v})}
    }else{
      const {error}=await sb.from('categories').update({name_pt:v}).eq('id',meta.id); if(error) throw error;
      await sb.from('transactions').update({category_pt:v}).eq('category',old);
      db.tx.forEach(t=>{if(t.cat===old)t.pt=v});
    }
    await loadCats();render();openCatManage();
  }catch(err){console.error(err);toast('更新失败')}
}
async function delCat(i){
  const c=db.cats[type][i], meta=db.catRow[type][c]; if(!meta) return;
  if(db.tx.some(t=>t.cat===c)) return toast('已使用类别不能删除');
  try{
    const {error}=await sb.from('categories').delete().eq('id',meta.id); if(error) throw error;
    await loadCats();openCatManage();renderBook();
  }catch(err){console.error(err);toast('删除失败')}
}
async function addCat(){
  const v=document.getElementById('newCatName').value.trim(), p=document.getElementById('newCatPt').value.trim()||v;
  if(!v) return; if(db.cats[type].includes(v)) return toast('类别已存在');
  try{
    const {error}=await sb.from('categories').insert({type,name:v,name_pt:p,sort_order:db.cats[type].length}); if(error) throw error;
    await loadCats();openCatManage();renderBook();
  }catch(err){console.error(err);toast('添加失败')}
}

/* ============================================================

   ============================================================ */
function weekNo(d){const x=new Date(d+'T00:00:00'),f=new Date(x.getFullYear(),0,1);return Math.floor(((x-f)/86400000+f.getDay())/7)+1}
function chartSource(){return chartRange==='year'?activeTx():activeTx().filter(t=>t.date.startsWith(viewYear+'-'))}
function group(arr){let m={};arr.forEach(t=>{let d=new Date(t.date+'T00:00:00'),key,label;if(chartRange==='week'){let w=weekNo(t.date);key=d.getFullYear()+'-W'+String(w).padStart(2,'0');label=d.getFullYear()+'年第'+w+'周'}else if(chartRange==='month'){key=t.date.slice(0,7);label=Number(t.date.slice(5,7))+'月'}else{key=t.date.slice(0,4);label=key+'年'}m[key]=m[key]||{key,label,total:0};m[key].total+=t.amount});return Object.values(m).sort((a,b)=>a.key.localeCompare(b.key)).filter(x=>x.total>0)}
function byKey(arr,key){return arr.filter(t=>{if(chartRange==='week'){let d=new Date(t.date+'T00:00:00');return d.getFullYear()+'-W'+String(weekNo(t.date)).padStart(2,'0')===key}if(chartRange==='month')return t.date.slice(0,7)===key;return t.date.slice(0,4)===key})}
function renderChart(){
  if(!connected){document.getElementById('chart').innerHTML=`<div class="chart-head" style="padding-bottom:20px"><div style="text-align:center;font-weight:800;font-size:17px;padding:10px 0">收支图表</div></div><div class="empty"><span class="em-ico">☁️</span>连接云端数据库后查看图表</div>`;return}
  const arr=chartSource().filter(t=>t.type===chartType),data=group(arr),total=data.reduce((s,x)=>s+x.total,0),avg=data.length?Math.round(total/data.length):0,sel=selectedChartKey?byKey(arr,selectedChartKey):[];
  let cats={};arr.forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);let catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  document.getElementById('chart').innerHTML=`<div class="chart-head"><div class="chart-type"><button class="${chartType==='EXPENSE'?'active':''}" onclick="chartType='EXPENSE';selectedChartKey='';renderChart()">支出</button><button class="${chartType==='INCOME'?'active':''}" onclick="chartType='INCOME';selectedChartKey='';renderChart()">收入</button></div><div class="segment"><button class="${chartRange==='week'?'active':''}" onclick="chartRange='week';selectedChartKey='';renderChart()">周</button><button class="${chartRange==='month'?'active':''}" onclick="chartRange='month';selectedChartKey='';renderChart()">月</button><button class="${chartRange==='year'?'active':''}" onclick="chartRange='year';selectedChartKey='';renderChart()">年</button></div></div><div class="chart-box"><div class="meta">总${chartType==='INCOME'?'收入':'支出'}：<b>${brl(total)}</b>　平均值：<b>${brl(avg)}</b></div><svg class="line" viewBox="0 0 340 170">${lineSvg(data)}</svg></div><div class="content" style="padding-top:0">${data.length?data.map(d=>`<div class="bill" onclick="selectedChartKey='${d.key}';renderChart()"><div class="bill-left"><div class="ico">📊</div><div class="bill-name">${d.label}</div></div><div class="amount">${brl(d.total)}</div></div>`).join(''):'<div class="empty">暂无数据</div>'}</div>${selectedChartKey?`<div class="rank"><div class="rank-title">具体明细</div>${sel.map(billRow).join('')||'<div class="empty">暂无明细</div>'}</div>`:''}<div class="rank"><div class="rank-title">排行榜</div>${catRows.length?catRows.map(([k,v])=>`<div class="rank-row"><div class="ico">${catIcon(k)}</div><div class="rank-info"><div class="rank-name"><span>${k}</span><span>${brl(v)}</span></div><div class="bar"><i style="width:${Math.round(v/(catRows[0][1]||1)*100)}%"></i></div></div></div>`).join(''):'<div class="empty">暂无数据</div>'}</div>`;
}
function lineSvg(data){if(!data.length)return '<text x="170" y="90" text-anchor="middle" fill="#aaa">暂无数据</text>';const max=Math.max(...data.map(d=>d.total),1),w=320,h=120,p=10,pts=data.map((d,i)=>[p+(data.length===1?w/2:i*(w/(data.length-1))),10+(1-d.total/max)*h]);return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b8860020" stroke-width="1.5"/>${pts.map((p,i)=>`<circle onclick="selectedChartKey='${data[i].key}';renderChart()" cx="${p[0]}" cy="${p[1]}" r="5" fill="#ffc53d" stroke="#20242a" stroke-width="1.2"/><text x="${p[0]}" y="158" font-size="9" text-anchor="middle" fill="#8a8f9c">${data[i].label.replace(viewYear+'年','')}</text>`).join('')}`}

function renderExportPage(){
  document.getElementById('exportPage').innerHTML=`<div class="export-head" style="padding-bottom:20px"><div class="me-name">导出 / 备份</div></div><div class="card"><div class="card-label">导出报表</div><div class="me-item" onclick="document.getElementById('exportScope').value='week';openModal('exportModal')"><div class="me-left">📅 按周导出</div><span>›</span></div><div class="me-item" onclick="document.getElementById('exportScope').value='month';openModal('exportModal')"><div class="me-left">🗓 按月导出</div><span>›</span></div><div class="me-item" onclick="document.getElementById('exportScope').value='year';openModal('exportModal')"><div class="me-left">📆 按年导出</div><span>›</span></div><div class="me-item" onclick="document.getElementById('exportScope').value='all';openModal('exportModal')"><div class="me-left">📒 导出全部</div><span>›</span></div></div><div class="card"><div class="card-label">云端数据</div><div class="me-item" onclick="downloadBackup()"><div class="me-left">⬇️ 备份为 JSON 文件</div><span>›</span></div><label class="me-item"><div class="me-left">⬆️ 从 JSON 文件导入</div><span>›</span><input type="file" accept="application/json" style="display:none" onchange="importBackup(event)"></label><div class="me-item" onclick="clearData()"><div class="me-left" style="color:var(--red)">🗑 清空全部账单</div><span>›</span></div></div>`;
}
function exportRows(scope){let arr=activeTx();if(scope==='month')arr=arr.filter(t=>t.date.startsWith(ym()));if(scope==='year')arr=arr.filter(t=>t.date.startsWith(String(viewYear)+'-'));if(scope==='week'){let w=weekNo(today()),y=new Date().getFullYear();arr=arr.filter(t=>new Date(t.date+'T00:00:00').getFullYear()===y&&weekNo(t.date)===w)}return arr.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt))}
function exportCSV(){
  if(!connected) return toast('请先连接云端数据库');
  let lang=document.getElementById('exportLang').value,scope=document.getElementById('exportScope').value,pt=lang==='pt',arr=exportRows(scope),head=pt?['Data','Categoria','Tipo','Valor','Conta','Responsável','Observação']:['日期','类别','类型','金额','账户','经手人','备注'];
  let rows=arr.map(t=>[t.date,pt?(t.pt||db.catPt[t.cat]||t.cat):t.cat,t.type==='INCOME'?(pt?'Receita':'收入'):(pt?'Despesa':'支出'),brl(t.amount),t.account,t.handler||'',t.note||'']);
  let title=pt?'Igreja Cristã Chinesa no Brasil':'巴西华人基督教会记账',sub=pt?'Relatório Financeiro':'财务报告';
  let csv=[[title],[sub],[scope],[],head,...rows].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pt?'relatorio-financeiro.csv':'教会财务报告.csv';a.click();closeModal('exportModal');
}
function downloadBackup(){
  const payload={exportedAt:new Date().toISOString(),cats:db.cats,catPt:db.catPt,accounts:db.accounts,tx:db.tx};
  let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='巴西华人基督教会记账备份.json';a.click();
}
async function importBackup(e){
  let f=e.target.files[0]; if(!f) return;
  if(!connected){toast('请先连接云端数据库');e.target.value='';return}
  if(!confirm('导入会把备份文件中的数据写入云端数据库，重复导入可能产生重复记录，确定继续？')){e.target.value='';return}
  let r=new FileReader();
  r.onload=async()=>{
    try{
      const data=JSON.parse(r.result);
      setLoading(true,'正在导入数据…');
      for(const t of ['INCOME','EXPENSE']){
        for(const name of (data.cats?.[t]||[])){
          if(!db.cats[t].includes(name)){
            await sb.from('categories').insert({type:t,name,name_pt:data.catPt?.[name]||name,sort_order:db.cats[t].length});
          }
        }
      }
      await loadCats();
      for(const a of (data.accounts||[])){
        if(!db.accounts.includes(a)) await sb.from('accounts').insert({name:a,sort_order:db.accounts.length});
      }
      await loadAccounts();
      const rows=(data.tx||[]).filter(t=>t.status!=='VOID').map(t=>({type:t.type,category:t.cat,category_pt:t.pt||t.cat,amount_cents:t.amount,tx_date:t.date,account:t.account||null,handler:t.handler||null,note:t.note||null,status:'ACTIVE'}));
      for(let i=0;i<rows.length;i+=200){
        const {error}=await sb.from('transactions').insert(rows.slice(i,i+200)); if(error) throw error;
      }
      await loadTx();
      setLoading(false);render();toast('导入完成，共 '+rows.length+' 条记录');
    }catch(err){console.error(err);setLoading(false);toast('导入失败：'+(err.message||''))}
    e.target.value='';
  };
  r.readAsText(f);
}
async function clearData(){
  if(!connected) return toast('请先连接云端数据库');
  if(!confirm('确定清空云端全部账单？类别和账户会保留，此操作不可撤销。')) return;
  try{
    setLoading(true,'正在清空…');
    const {error}=await sb.from('transactions').delete().not('id','is',null); if(error) throw error;
    await loadTx();setLoading(false);render();toast('已清空');
  }catch(err){console.error(err);setLoading(false);toast('清空失败：'+(err.message||''))}
}

function openAccountManage(){

  document.getElementById('newAccountName').value='';openModal('accountModal');

async function renameAccount(i,v){
  v=v.trim(); if(!v) return openAccountManage();
  const old=db.accounts[i], meta=db.accountRow[old]; if(!meta) return;
  try{
    const {error}=await sb.from('accounts').update({name:v}).eq('id',meta.id); if(error) throw error;
    if(old!==v){await sb.from('transactions').update({account:v}).eq('account',old);db.tx.forEach(t=>{if(t.account===old)t.account=v})}
    await loadAccounts();render();openAccountManage();
  }catch(err){console.error(err);toast('更新失败')}
}
async function delAccount(i){
  const a=db.accounts[i], meta=db.accountRow[a]; if(!meta) return;
  if(db.tx.some(t=>t.account===a)) return toast('已使用账户不能删除');
  try{
    const {error}=await sb.from('accounts').delete().eq('id',meta.id); if(error) throw error;
    await loadAccounts();openAccountManage();render();
  }catch(err){console.error(err);toast('删除失败')}
}
async function addAccount(){
  const v=document.getElementById('newAccountName').value.trim(); if(!v) return;
  if(db.accounts.includes(v)) return toast('账户已存在');
  try{
    const {error}=await sb.from('accounts').insert({name:v,sort_order:db.accounts.length}); if(error) throw error;
    await loadAccounts();openAccountManage();render();
  }catch(err){console.error(err);toast('添加失败')}
}

/* ============================================================
   Supabase 云端数据层
   ============================================================ */
function rowToTx(r){return {id:r.id,type:r.type,cat:r.category,pt:r.category_pt||r.category,amount:r.amount_cents,date:r.tx_date,account:r.account,handler:r.handler,note:r.note,status:r.status,createdAt:r.created_at}}

async function loadCats(){
  const {data,error}=await sb.from('categories').select('*').order('sort_order',{ascending:true});
  if(error){console.error(error);toast('加载类别失败');return}
  db.cats={INCOME:[],EXPENSE:[]};db.catPt={};db.catRow={INCOME:{},EXPENSE:{}};
  (data||[]).forEach(r=>{db.cats[r.type].push(r.name);db.catPt[r.name]=r.name_pt||r.name;db.catRow[r.type][r.name]={id:r.id,sort_order:r.sort_order}});
}
async function loadAccounts(){
  const {data,error}=await sb.from('accounts').select('*').order('sort_order',{ascending:true});
  if(error){console.error(error);toast('加载账户失败');return}
  db.accounts=(data||[]).map(r=>r.name);
  db.accountRow={};(data||[]).forEach(r=>db.accountRow[r.name]={id:r.id,sort_order:r.sort_order});
}
async function loadTx(){
  const {data,error}=await sb.from('transactions').select('*').order('tx_date',{ascending:false}).order('created_at',{ascending:false});
  if(error){console.error(error);toast('加载账单失败');return}
  db.tx=(data||[]).map(rowToTx);
}
async function seedIfEmpty(){
  const s=seedDefaults();
  if(db.cats.INCOME.length===0 && db.cats.EXPENSE.length===0){
    let rows=[];
    ['INCOME','EXPENSE'].forEach(t=>{s.cats[t].forEach((name,i)=>rows.push({type:t,name,name_pt:s.catPt[name]||name,sort_order:i}))});
    const {error}=await sb.from('categories').insert(rows); if(error){console.error(error)} else {await loadCats()}
  }
  if(db.accounts.length===0){
    const rows=s.accounts.map((name,i)=>({name,sort_order:i}));
    const {error}=await sb.from('accounts').insert(rows); if(error){console.error(error)} else {await loadAccounts()}
  }
}
async function loadAll(){
  setLoading(true,'正在从云端加载数据…');
  await loadCats();
  await loadAccounts();
  await seedIfEmpty();
  await loadTx();
  setLoading(false);
  render();
}
function subscribeRealtime(){
  if(realtimeChannel){try{sb.removeChannel(realtimeChannel)}catch{}}
  realtimeChannel=sb.channel('bccb-realtime-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'transactions'},()=>{loadTx().then(render)})
    .on('postgres_changes',{event:'*',schema:'public',table:'categories'},()=>{loadCats().then(render)})
    .on('postgres_changes',{event:'*',schema:'public',table:'accounts'},()=>{loadAccounts().then(render)})
    .subscribe();
}

async function connectSupabase(url,key,silent){
  document.getElementById('cloudModalMsg').textContent='';
  try{
    sb=window.supabase.createClient(url,key);
    const {error}=await sb.from('accounts').select('id',{count:'exact',head:true});
    if(error) throw error;
    cloudCfg={url,key}; localStorage.setItem(CFG_KEY,JSON.stringify(cloudCfg));
    connected=true; closeModal('cloudModal');
    if(!silent) toast('已连接云端数据库');
    await loadAll();
    subscribeRealtime();
  }catch(err){
    console.error(err);
    connected=false; sb=null;
    const msg='连接失败：'+(err.message||'请检查地址和密钥是否正确，以及是否已运行建表脚本');
    if(!silent){document.getElementById('cloudModalMsg').textContent=msg;document.getElementById('cloudModalMsg').style.color='var(--red)'}
    else toast('云端连接失败，请到"设置"重新连接');
    setLoading(false); render();
  }
}
function submitCloudConfig(){
  const url=document.getElementById('cloudUrlInput').value.trim();
  const key=document.getElementById('cloudKeyInput').value.trim();
  if(!url||!key) return toast('请填写完整的 URL 和 anon key');
  setLoading(true,'正在连接…');
  connectSupabase(url,key,false);
}

async function boot(){
  if(cloudCfg && cloudCfg.url && cloudCfg.key){
    document.getElementById('cloudUrlInput').value=cloudCfg.url;
    document.getElementById('cloudKeyInput').value=cloudCfg.key;
    setLoading(true,'正在连接云端数据库…');
    await connectSupabase(cloudCfg.url,cloudCfg.key,true);
  }else{
    setLoading(false); connected=false; render(); openModal('cloudModal');
  }
}
render();
boot();
</script>
